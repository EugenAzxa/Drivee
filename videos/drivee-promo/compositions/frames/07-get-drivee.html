      var rings = [el("ring-a"), el("ring-b"), el("ring-c")];
      var mark = el("mark");
      var tile = el("tile");
      var dFill = el("d-fill");

      var tagline = el("tagline");
      var badgeApple = el("badge-apple");

      // Scene 1 (0.00-0.80) — "Drivee.": the D mark draws on, then fills.

        { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" },
