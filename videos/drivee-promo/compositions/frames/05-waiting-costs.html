  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "05-waiting-costs";
      var $ = function (s) { return document.getElementById(FID + "-" + s); };

      var DUR = 4.331;
      var INK = "#0B1430";
      var RED = "#dc2626";
      var PRIMARY = "#2D63F0";

      // --- City of Toronto fee schedule (exact) ---
      var STEPS = [
        { day: 16, from: 30.0, to: 45.39 },   // +$15.39 address search fee
        { day: 31, from: 45.39, to: 77.49 },  // +$32.10 late payment fee
        { day: 60, from: 77.49, to: 109.59 }  // +$32.10 plate denial
      ];
      var BASE = 30.0;
      var FINAL = 109.59;

      // Day counter runs linearly 1 -> 60 across T0..T1 (Scene 2).
      var T0 = 1.0;
      var T1 = 2.9;
      var ROLL = 0.24; // amount roll at each threshold

      // displayed day = round(1 + 59p) -> day D first shows at p = (D - 1.5) / 59
      function dayTime(D) { return T0 + ((D - 1.5) / 59) * (T1 - T0); }
      STEPS.forEach(function (s) { s.t = dayTime(s.day); });

      function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
      function easeOut3(x) { var u = 1 - x; return 1 - u * u * u; } // matches "power3.out"

      function dayAt(t) {
        if (t <= T0) return 1;
        if (t >= T1) return 60;
        return Math.round(1 + 59 * ((t - T0) / (T1 - T0)));
      }
      function amountAt(t) {
        var v = BASE;
        for (var i = 0; i < STEPS.length; i++) {
          var s = STEPS[i];
          if (t < s.t) break;
          var x = clamp01((t - s.t) / ROLL);
          v = x >= 1 ? s.to : s.from + (s.to - s.from) * easeOut3(x);
        }
        return v;
      }

      var dayEl = $("day-num");
      var amtEl = $("amount");
      var lastDay = "", lastAmt = "";
      function render(t) {
        var d = String(dayAt(t));
        var a = "$" + amountAt(t).toFixed(2);
        if (d !== lastDay) { dayEl.textContent = d; lastDay = d; }
        if (a !== lastAmt) { amtEl.textContent = a; lastAmt = a; }
      }
      render(0);

      // counting-dynamic-scale: scale grows with the value, final size is static CSS
      var S0 = 0.8;
      function scaleFor(v) { return S0 + (1 - S0) * ((v - BASE) / (FINAL - BASE)); }

      var tl = gsap.timeline({ paused: true });

      // Text driver: one proxy carries timeline time; onUpdate only writes text.
      var drv = { t: 0 };
      tl.to(drv, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(drv.t); } }, 0);

      // ---- Scene 1 (0.0-1.0): push-THROUGH lands on the instrument ----
      var cam = $("camera");
      tl.fromTo(cam, { scale: 1.16 }, { scale: 1.0, duration: 0.75, ease: "expo.out" }, 0);
      tl.to(cam, { scale: 1.025, duration: 3.2 - 0.75, ease: "none" }, 0.75);

      tl.fromTo($("accent"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.1);
      tl.fromTo($("eyebrow"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 0.15);
      tl.fromTo($("day"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.05);
      tl.fromTo(amtEl, { scale: S0 * 0.92, opacity: 0.0 }, { scale: S0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.0);
      tl.fromTo($("track"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.35);
      tl.fromTo(
        [$("tick-1"), $("tick-16"), $("tick-31"), $("tick-60")],
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.06 },
        0.5
      );
      tl.fromTo($("source"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 3.2);

      // ---- Scene 2 (1.0-3.2): day 1 -> 60, bar fills, amount steps at each threshold ----
      var fill = $("fill");
      tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: T1 - T0, ease: "none" }, T0);
      tl.fromTo($("tick-1"), { color: "#9A9A9A" }, { color: INK, duration: 0.2, immediateRender: false }, T0);

      STEPS.forEach(function (s, i) {
        // amount scale grows with value (same timing + ease as the roll)
        tl.to(amtEl, { scale: scaleFor(s.to), duration: ROLL, ease: "power3.out" }, s.t);
        // tick lights up as the day reaches it
        var tick = $("tick-" + s.day);
        tl.to(tick, { color: s.day >= 31 ? RED : INK, duration: 0.2, ease: "power1.out" }, s.t);
        tl.fromTo(tick, { scale: 1 }, { scale: 1.35, duration: 0.12, ease: "power2.out", immediateRender: false }, s.t);
        tl.to(tick, { scale: 1, duration: 0.25, ease: "power2.inOut" }, s.t + 0.12);
        // fee label pops in as it lands
        tl.fromTo(
          $("fee-" + s.day),
          { opacity: 0, scale: 0.86, y: 18 },
          { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" },
          s.t
        );
      });

      // From Day 31: amount + bar turn red
      var t31 = STEPS[1].t;
      tl.to(amtEl, { color: RED, duration: 0.25, ease: "power1.out" }, t31);
      tl.fromTo(fill, { backgroundColor: PRIMARY }, { backgroundColor: RED, duration: 0.25, ease: "power1.out", immediateRender: false }, t31);
      tl.to($("tick-1"), { color: RED, duration: 0.25 }, t31);
      tl.to($("tick-16"), { color: RED, duration: 0.25 }, t31);

      // ---- Scene 3 (3.2-end): $109.59 holds large in red; small push toward it, then still ----
      tl.to(cam, { scale: 1.06, duration: 0.5, ease: "power3.out" }, 3.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
