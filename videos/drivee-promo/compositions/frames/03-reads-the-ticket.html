    <script>
      (function () {

        var root = document.querySelector('[data-composition-id="' + ID + '"]');

        var qa = function (n) { return root.querySelectorAll(".\\30 3-reads-the-ticket-" + n); };

        var tl = gsap.timeline({ paused: true });

        var rows = [q("row1"), q("row2"), q("row3")];
        var part = function (row, n) { return row.querySelector(".\\30 3-reads-the-ticket-" + n); };

        // ---- Scene 1 (0.0-1.0): same phone; ticket card + thumbnail settle, scan line passes once

        tl.fromTo(q("thumb"), { scale: 0.94 }, { scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.02);
        tl.fromTo(q("status"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 0.1);
        tl.fromTo(q("count"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.16);
        tl.fromTo(q("track"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.2);
