<script>
(function () {
  var FID = "02-snap-a-photo";
  var DURATION = 2.709;
  function q(name) { return '[id="' + FID + "-" + name + '"]'; }

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  // ---- virtual camera: slow steady push under the whole shot ----
  tl.fromTo(q("cam"), { scale: 1 }, { scale: 1.035, duration: DURATION, ease: "sine.inOut" }, 0);
  tl.fromTo(q("halo"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" }, 0);

  // ---- Scene 1 (0.0-1.2s) "Open Drivee": phone rises into center ----
  tl.fromTo(q("phone"), { y: 360, rotation: 3 }, { y: 0, rotation: 0, duration: 0.75, ease: "power3.out" }, 0);
  tl.fromTo(q("phone"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0);

  // app header: D mark + name
  tl.fromTo([q("logo"), q("brand")], { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.08 }, 0.3);

  // viewfinder + brackets open wide at the viewfinder corners
  tl.fromTo(q("vf"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.4);
  var WIDE = {
    "br-tl": { x: -39, y: -64 },
    "br-tr": { x: 39, y: -64 },
    "br-bl": { x: -39, y: 114 },
    "br-br": { x: 39, y: 114 }
  };
  Object.keys(WIDE).forEach(function (k, i) {
    var w = WIDE[k];
    tl.fromTo(q(k),
      { x: w.x * 1.25, y: w.y * 1.15, opacity: 0 },
      { x: w.x, y: w.y, opacity: 1, duration: 0.4, ease: "power3.out" },
      0.55 + i * 0.04);
  });

  // camera controls spring in
  tl.fromTo([q("thumb"), q("shutter"), q("flip")],
    { scale: 0.7, opacity: 0 },
    { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)", stagger: 0.06 }, 0.7);

  // ---- Scene 2 (1.2-2.1s) "snap a photo": ticket settles, brackets tighten ----
  tl.fromTo(q("ticket"),
    { y: 690, x: 30, rotation: 10, scale: 1.08 },
    { y: 0, x: 0, rotation: -3, scale: 1, duration: 0.65, ease: "power3.out" }, 1.2);
  tl.fromTo(q("ticket"), { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.55, ease: "power2.out" }, 1.3);

  Object.keys(WIDE).forEach(function (k) {
    tl.to(q(k), { x: 0, y: 0, duration: 0.42, ease: "power3.inOut" }, 1.6);
  });

  // ---- Scene 3 (2.1-end) shutter: press-release-spring + flash + chip ----
  var PRESS_START = 2.1, PRESS_DUR = 0.1, RELEASE_DUR = 0.5;
  var RELEASE_START = PRESS_START + PRESS_DUR;
  tl.to(q("shutter"), { scale: 0.88, boxShadow: "0 3px 8px rgba(45, 99, 240, 0.22)", duration: PRESS_DUR, ease: "power1.in" }, PRESS_START);
  tl.to(q("shutter"), { scale: 1, boxShadow: "0 12px 26px rgba(45, 99, 240, 0.28)", duration: RELEASE_DUR, ease: "back.out(2)" }, RELEASE_START);
  tl.fromTo(q("burst"), { scale: 1, opacity: 0 }, { scale: 1.9, opacity: 0.6, duration: 0.22, ease: "power2.out" }, RELEASE_START);
  tl.to(q("burst"), { opacity: 0, duration: 0.25, ease: "power2.in" }, RELEASE_START + 0.22);
  tl.to(q("glow"), { opacity: 0.25, duration: 0.5, ease: "power2.out" }, RELEASE_START);

  // one white flash on the screen
  tl.fromTo(q("flash"), { opacity: 0 }, { opacity: 0.92, duration: 0.05, ease: "none" }, RELEASE_START);
  tl.to(q("flash"), { opacity: 0, duration: 0.3, ease: "power2.out" }, RELEASE_START + 0.05);

  // captured shot lands in the gallery thumb
  tl.fromTo(q("thumbfill"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.8)" }, RELEASE_START + 0.04);

  // "Reading…" chip under the ticket
  tl.fromTo(q("chip"), { y: 16, scale: 0.85, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.32, ease: "back.out(1.7)" }, RELEASE_START + 0.08);

  // pad timeline to the full frame length (hold)
  tl.set({}, {}, DURATION);

  window.__timelines[FID] = tl;
})();
</script>
